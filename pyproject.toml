[build-system]
requires = [
  "setuptools>=61",
  "wheel",
  "pybind11>=2.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "qmodel"
dynamic = ["version"]
description = "Modular training and evaluation utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qmodel*"]

[tool.setuptools.dynamic]
version = {attr = "qmodel.version.__version__"}

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "pytest-cov",
  "twine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
